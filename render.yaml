services:
  - type: web
    name: atelier-backend
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # prisma/migrations/ is committed (see 0_initial_schema/), so deploys
    # apply tracked migrations in order via `migrate deploy` rather than
    # `db push`, which would silently ignore the migration history table.
    buildCommand: "npm ci && npx prisma migrate deploy && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: DATABASE_URL
        sync: false # set this to your CockroachDB Serverless connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      # "Sign in with Google" — OAuth 2.0 Client ID (type "Web application")
      # from Google Cloud Console > APIs & Services > Credentials. Add both
      # https://<your-netlify-site>.netlify.app AND this backend's Render
      # URL under "Authorized JavaScript origins" on that same credential.
      # No client secret needed — this only verifies ID tokens.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Set this to your Netlify site URL(s) after the frontend is deployed,
      # comma-separated if you have more than one (prod + deploy previews).
      # e.g. "https://your-site.netlify.app"
      - key: FRONTEND_URL
        sync: false
      # Avatar hosting (uploaded + AI-generated images) — Cloudflare R2.
      # Cloudinary flagged this app's AI-generated adult content under its
      # Acceptable Use Policy and threatened account termination, so image
      # storage moved to R2 (same Cloudflare account as Workers AI below,
      # confirmed NSFW-permissive by Cloudflare's own community team). Free
      # tier: 10GB storage + 1M writes + 10M reads/month, permanently, $0
      # egress. Get R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY from Cloudflare
      # dashboard -> R2 -> Manage R2 API Tokens -> Create API Token (needs
      # Object Read & Write). R2_BUCKET_NAME is whatever you name the bucket
      # when you create it. R2_PUBLIC_URL is the r2.dev URL Cloudflare gives
      # you when you enable public access on that bucket (or your own custom
      # domain once you set one up on the bucket's Settings page).
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # No longer used (src/lib/cloudinary.ts is dead code as of the R2
      # migration above) — left here only so nothing breaks if you haven't
      # removed these from your actual Render dashboard env vars yet. Safe
      # to delete once you confirm R2 is working.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Avatar image generation — Pollinations (already free/keyless,
      # unfiltered for explicit personas) is tried first, then Cloudflare
      # Workers AI as the fallback (see CLOUDFLARE_ACCOUNT_ID/TOKEN below).
      # HUGGINGFACE_API_KEY/HUGGINGFACE_IMAGE_MODEL are wired in as a third,
      # last-resort fallback in src/routes/avatar.ts (tried after Pollinations
      # and Cloudflare both fail). Note hf-inference has been dropping FLUX
      # models; stabilityai/stable-diffusion-2-1 was the last model confirmed
      # working there as of July 2026 — verify before relying on it.
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_IMAGE_MODEL
        value: "stabilityai/stable-diffusion-2-1"
      # Cloudflare Workers AI — fallback image provider. Free tier: 10,000
      # neurons/day, no credit card. Get both values from the Cloudflare
      # dashboard: AI -> Workers AI -> "Create a Workers AI API Token"
      # (Account ID is shown on the same page).
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Per-provider image generation timeout (seconds). Lowered from the
      # original 30s default — each provider attempt (plus Pollinations'
      # own internal retry) was compounding into 90+ second worst-case waits.
      - key: IMAGE_GEN_TIMEOUT_SECONDS
        value: "18"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.6-27b"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_MODEL
        value: "meta/llama-3.1-70b-instruct"
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: "llama-3.3-70b"
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY_2
        sync: false
      - key: SAMBANOVA_MODEL
        value: "Meta-Llama-3.3-70B-Instruct"
      # Per-provider time-to-first-token timeout (seconds) for the hosted
      # text chat providers (NVIDIA/Cerebras/SambaNova/Groq). Lowered from
      # 15s to 8s so a slow-but-not-dead provider gets skipped faster instead
      # of eating that latency on every single request.
      - key: GROQ_TIMEOUT_SECONDS
        value: "8"
      - key: NVIDIA_TIMEOUT_SECONDS
        value: "8"
      - key: CEREBRAS_TIMEOUT_SECONDS
        value: "8"
      - key: SAMBANOVA_TIMEOUT_SECONDS
        value: "8"
      - key: NODE_ENV
        value: "production"
      # Billing (Razorpay) — everything in src/routes/billing.ts 503s unless
      # this is exactly "true", regardless of whether the keys below are
      # set. Leave it "false" until you're actually ready to take payments;
      # see src/lib/payments/razorpay.ts for the full rundown.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Optional: only needed if you configure a webhook in the Razorpay
      # dashboard (Settings → Webhooks) pointed at /api/billing/webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

