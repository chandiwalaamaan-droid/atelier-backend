services:
  - type: web
    name: atelier-backend
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # prisma/migrations/ is committed (see 0_initial_schema/), so deploys
    # apply tracked migrations in order via `migrate deploy` rather than
    # `db push`, which would silently ignore the migration history table.
    buildCommand: "npm ci && npx prisma migrate deploy && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: DATABASE_URL
        sync: false # set this to your CockroachDB Serverless connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      # "Sign in with Google" — OAuth 2.0 Client ID (type "Web application")
      # from Google Cloud Console > APIs & Services > Credentials. Add both
      # https://<your-netlify-site>.netlify.app AND this backend's Render
      # URL under "Authorized JavaScript origins" on that same credential.
      # No client secret needed — this only verifies ID tokens.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Set this to your Netlify site URL(s) after the frontend is deployed,
      # comma-separated if you have more than one (prod + deploy previews).
      # e.g. "https://your-site.netlify.app"
      - key: FRONTEND_URL
        sync: false
      # Avatar hosting (uploaded + AI-generated images). Free account at
      # backblaze.com/b2 (10GB free) — no persistent disk needed, images
      # survive restarts. Key id/app key from the Application Keys page,
      # bucket name/endpoint from the bucket's own page. Bucket can stay
      # PRIVATE — the backend proxies/streams images itself via
      # /api/images/:key (see src/routes/images.ts), so no card-on-file is
      # needed for B2's first-public-bucket verification.
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      # Avatar image generation — Pollinations (already free/keyless) is
      # primary; this is the fallback used only if Pollinations fails.
      # Free token from huggingface.co.
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_IMAGE_MODEL
        value: "black-forest-labs/FLUX.1-schnell"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.6-27b"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_MODEL
        value: "meta/llama-3.1-70b-instruct"
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY_2
        sync: false
      - key: CEREBRAS_MODEL
        value: "llama-3.3-70b"
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY_2
        sync: false
      - key: SAMBANOVA_MODEL
        value: "Meta-Llama-3.3-70B-Instruct"
      - key: NODE_ENV
        value: "production"
      # Billing (Razorpay) — everything in src/routes/billing.ts 503s unless
      # this is exactly "true", regardless of whether the keys below are
      # set. Leave it "false" until you're actually ready to take payments;
      # see src/lib/payments/razorpay.ts for the full rundown.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Optional: only needed if you configure a webhook in the Razorpay
      # dashboard (Settings → Webhooks) pointed at /api/billing/webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

